version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-governance-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATAHUB_GMS_URL=${DATAHUB_GMS_URL:-http://host.docker.internal:8080}
      - DATAHUB_TOKEN=${DATAHUB_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:-super-secret-governance-key-change-in-production}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-mock_client_id}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-mock_client_secret}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3000/auth/github/callback}
      - DATABASE_URL=sqlite:///./auditor.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent-governance-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
